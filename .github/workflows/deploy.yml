name: build-and-deploy

# Jalankan pipeline GFS lalu publish frontend+data ke GitHub Pages.
# Cron tiap 6 jam (menit :15). Bisa juga dipicu manual (workflow_dispatch).
on:
  push:
    branches: [main]
  schedule:
    # 04:00 WIB = 21:00 UTC (hari sebelumnya). Sekali sehari.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # eccodes butuh pustaka C; wheel pip biasanya sudah membawa binernya,
      # tapi pasang libeccodes0 sistem sebagai jaring pengaman.
      - name: Install eccodes system lib (fallback)
        run: sudo apt-get update && sudo apt-get install -y libeccodes0

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Hydrate window from live site (retensi -24 jam)
        working-directory: backend/pipeline
        env:
          SITE_DATA_URL: https://bungakertas-py.github.io/cesgs-nimbus/backend/data/output
        run: python hydrate.py || true

      - name: Run pipeline (unduh GFS + generate output)
        working-directory: backend/pipeline
        run: python run.py

      - name: Assemble site (jaga struktur ../backend/data/output)
        run: |
          mkdir -p _site/frontend _site/backend/data/output
          cp -r frontend/. _site/frontend/
          cp -r backend/data/output/. _site/backend/data/output/
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>CESGS Nimbus — Peta Cuaca Interaktif Indonesia</title>
          <meta http-equiv="refresh" content="0; url=./frontend/index.html">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="CESGS Nimbus">
          <meta property="og:title" content="CESGS Nimbus — Peta Cuaca Interaktif Indonesia">
          <meta property="og:description" content="Angin, hujan, suhu, awan, dan tekanan untuk seluruh Indonesia. Klik lokasimu untuk prakiraan detail per jam.">
          <meta property="og:url" content="https://bungakertas-py.github.io/cesgs-nimbus/">
          <meta property="og:image" content="https://bungakertas-py.github.io/cesgs-nimbus/frontend/og-image.png">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:image" content="https://bungakertas-py.github.io/cesgs-nimbus/frontend/og-image.png">
          <a href="./frontend/index.html">Buka CESGS Nimbus</a>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
